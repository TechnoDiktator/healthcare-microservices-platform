spring.application.name=doctor-service

grpc.server.port=9090

billing.service.address=${BILLING_SERVICE_ADDRESS:billing-service}
billing.service.grpc.port=${BILLING_SERVICE_GRPC_PORT:9001}

patient.service.address=${PATIENT_SERVICE_ADDRESS:patient-service}
patient.service.grpc.port=${PATIENT_SERVICE_GRPC_PORT:9096}
auth.service.url=${AUTH_SERVICE_URL:http://auth-service:4005}


spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always



management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.otlp.tracing.endpoint=http://jaeger:4318/v1/traces