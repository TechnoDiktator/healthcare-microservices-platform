version: "3.9"

services:

  #################################################
  # PostgreSQL - Patient Service
  #################################################


  patient-service-db:
    image: postgres:17
    container_name: patient-service-db

    ports:
      - "5000:5432"

    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password

    volumes:
      - patient-db-data:/var/lib/postgresql/data

    networks:
      - internal

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"]
      interval: 10s
      timeout: 5s
      retries: 5

  #################################################
  # PostgreSQL - Auth Service
  #################################################
  auth-service-db:
    image: postgres:17
    container_name: auth-service-db
    ports:
      - "5001:5432"
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"]
      interval: 10s
      timeout: 5s
      retries: 5


  #################################################
  # PostgreSQL - Billing Service
  #################################################
  billing-service-db:
    image: postgres:17
    container_name: billing-service-db

    ports:
      - "5009:5432"

    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password

    volumes:
      - billing-db-data:/var/lib/postgresql/data

    networks:
      - internal

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"]
      interval: 10s
      timeout: 5s
      retries: 5

  #################################################
  # MongoDB - Doctor Service
  #################################################
  doctor-mongodb:
    image: mongo:8
    container_name: doctor-mongodb

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - doctor-mongodb-data:/data/db

    networks:
      - internal

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  #################################################
  # MongoDB - Analytics Service
  #################################################
  analytics-mongo-db:
    image: mongo:8
    container_name: analytics-mongo-db

    ports:
      - "27018:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - analytics-mongodb-data:/data/db

    networks:
      - internal

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5



  #################################################
  # Kafka
  #################################################
  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9092:9092"
      - "9094:9094"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - internal

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10




  #################################################
  # Billing Service
  #################################################
  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile

    image: billing-service:latest
    container_name: billing-service

    ports:
      - "4001:4001"
      - "9001:9001" # gRPC Server

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001

    depends_on:
      billing-service-db:
        condition: service_healthy

      kafka:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4001/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - internal

  #################################################
  # Doctor Service
  #################################################
  doctor-service:
    build:
      context: ./doctor-service
      dockerfile: Dockerfile

    image: doctor-service:latest
    container_name: doctor-service

    ports:
      - "8080:8080"
      - "9090:9090" # gRPC Server

    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:password@doctor-mongodb:27017/doctor_db?authSource=admin

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      AUTH_SERVICE_ADDRESS: auth-service

      PATIENT_SERVICE_ADDRESS: patient-service
      PATIENT_SERVICE_GRPC_PORT: 9096

      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001

    depends_on:
      doctor-mongodb:
        condition: service_healthy

      kafka:
        condition: service_healthy

      auth-service:
        condition: service_healthy

      patient-service:
        condition: service_healthy

      billing-service:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4001/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  #################################################
  # Patient Service
  #################################################
  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile

    image: patient-service:latest
    container_name: patient-service

    ports:
      - "4000:4000"
      - "9096:9096" # gRPC server

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      DOCTOR_SERVICE_ADDRESS: doctor-service
      DOCTOR_SERVICE_GRPC_PORT: 9090

      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001

    depends_on:
      patient-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4001/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - internal

  #################################################
  # Analytics Service
  #################################################
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile

    image: analytics-service:latest
    container_name: analytics-service

    ports:
      - "4002:4002"

    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:password@analytics-mongo-db:27017/analytics_db?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      analytics-mongo-db:
        condition: service_healthy

      kafka:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4001/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal


  #################################################
  # Auth Service
  #################################################
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

    image: auth-service:latest
    container_name: auth-service

    depends_on:
      auth-service-db:
        condition: service_healthy

    ports:
      - "4005:4005"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always

      JWT_SECRET: 01kLKnR0fQjeHeeSyENuemrEma4UMeeCSzXBD3e5nds=


    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4001/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - internal

    restart: unless-stopped

  #################################################
  # API Gateway
  #################################################

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    image: api-gateway:latest
    container_name: api-gateway

    ports:
      - "4004:4004"

    environment:
      AUTH_SERVICE_URL: http://auth-service:4005

    depends_on:
      auth-service:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4001/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5


    networks:
      - internal

volumes:
  patient-db-data:
  auth-db-data:
  billing-db-data:
  doctor-mongodb-data:
  analytics-mongodb-data:
  kafka-data: