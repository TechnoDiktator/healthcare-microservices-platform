version: "3.9"

services:

  #################################################
  # PostgreSQL - Patient Service
  #################################################
  patient-db:
    image: postgres:17
    container_name: patient-db
    restart: always
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - patient_db_data:/var/lib/postgresql/data

  #################################################
  # PostgreSQL - Auth Service
  #################################################
  auth-db:
    image: postgres:17
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  #################################################
  # PostgreSQL - Billing Service
  #################################################
  billing-db:
    image: postgres:17
    container_name: billing-db
    restart: always
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - billing_db_data:/var/lib/postgresql/data

  #################################################
  # MongoDB - Doctor Service
  #################################################
  doctor-mongodb:
    image: mongo:8
    container_name: doctor-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - doctor_mongo_data:/data/db

  #################################################
  # Kafka
  #################################################
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: always

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  #################################################
  # Billing Service
  #################################################
  billing-service:

    build:
      context: ./billing-service

    container_name: billing-service

    depends_on:
      - billing-db

    ports:
      - "8083:8080"
      - "9001:9001"

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-db:5432/billing_db

      SPRING_DATASOURCE_USERNAME: admin_user

      SPRING_DATASOURCE_PASSWORD: password

  #################################################
  # Doctor Service
  #################################################
  doctor-service:

    build:
      context: ./doctor-service

    container_name: doctor-service

    depends_on:
      - doctor-mongodb
      - billing-service

    ports:
      - "8082:8080"
      - "9090:9090"

    environment:

      SPRING_DATA_MONGODB_URI: mongodb://admin:password@doctor-mongodb:27017/doctor_db?authSource=admin

      BILLING_SERVICE_ADDRESS: billing-service

      BILLING_SERVICE_GRPC_PORT: 9001

  #################################################
  # Patient Service
  #################################################
  patient-service:

    build:
      context: ./patient-service

    container_name: patient-service

    depends_on:
      - patient-db
      - doctor-service
      - kafka

    ports:
      - "4000:4000"

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-db:5432/patient_db

      SPRING_DATASOURCE_USERNAME: admin_user

      SPRING_DATASOURCE_PASSWORD: password

      DOCTOR_SERVICE_ADDRESS: doctor-service

      DOCTOR_SERVICE_GRPC_PORT: 9090

      BILLING_SERVICE_ADDRESS: billing-service

      BILLING_SERVICE_GRPC_PORT: 9001

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  #################################################
  # Auth Service
  #################################################
  auth-service:

    build:
      context: ./auth-service

    container_name: auth-service

    depends_on:
      - auth-db

    ports:
      - "8081:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db

      SPRING_DATASOURCE_USERNAME: admin_user

      SPRING_DATASOURCE_PASSWORD: password

  #################################################
  # API Gateway
  #################################################
  api-gateway:

    build:
      context: ./api-gateway

    container_name: api-gateway

    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - billing-service

    ports:
      - "8080:8080"

    environment:

      AUTH_SERVICE_URL: http://auth-service:8080

      PATIENT_SERVICE_URL: http://patient-service:4000

      DOCTOR_SERVICE_URL: http://doctor-service:8080

      BILLING_SERVICE_URL: http://billing-service:8080

volumes:

  patient_db_data:

  auth_db_data:

  billing_db_data:

  doctor_mongo_data: